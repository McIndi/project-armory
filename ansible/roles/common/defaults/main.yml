---
# Fallback paths for OpenBao's on-controller state, used when a play hasn't
# loaded the openbao role's own defaults (e.g. standalone readiness/unseal
# playbooks). Derived from openbao_work_dir — set at the inventory level, so
# it's in scope regardless of which roles the play actually runs — rather than
# a second hardcoded path that can drift from the openbao role's own default.
common_openbao_init_keys_file: "{{ openbao_work_dir | default('/opt/openbao') }}/init-keys.yml"
common_openbao_vault_pass_file: "{{ openbao_work_dir | default('/opt/openbao') }}/.vault-pass"
common_openbao_provisioner_token_file: "{{ openbao_work_dir | default('/opt/openbao') }}/provisioner-token.yml"

common_log_nolog: "{{ lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true) | bool }}"

# Shared kubeconfig path for common kubectl-based helper tasks.
common_kubeconfig_path: "{{ armory_kubeconfig_path | default(lookup('ansible.builtin.env', 'KUBECONFIG'), true) }}"

# Lifetime of a fire-and-forget port-forward tunnel. Must comfortably outlast the
# longest play, since the tunnel has to stay up for every task that follows the
# one that opened it.
common_port_forward_ttl_seconds: 7200

# How long to wait for a freshly opened tunnel to accept connections.
common_port_forward_ready_timeout_seconds: 30

# Whether stop_port_forwards.yml also removes the loopback aliases it added to
# /etc/hosts. Turn off to keep them for manual debugging after a run.
common_port_forward_clear_hosts: true

# Shared cert-manager issuer defaults for common certificate helper task.
common_certificate_issuer_kind: ClusterIssuer
common_certificate_issuer_group: cert-manager.io

# Shared certificate wait timeout in seconds.
common_certificate_wait_timeout_seconds: 180

# Shared OpenBao namespace default for CA-copy helper task.
common_openbao_namespace: "{{ openbao_namespace | default('openbao') }}"
