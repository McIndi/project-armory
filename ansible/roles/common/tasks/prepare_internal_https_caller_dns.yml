---
# Make an in-cluster Service reachable from the Ansible controller by its
# INTERNAL FQDN.
#
# The FQDN is always preserved — it is the name in the server certificate's SAN,
# and every caller addresses the service by it. Only what the name RESOLVES TO
# differs by network path, so no certificate, URL, or *_addr variable ever has to
# change. In this OpenShift-only branch the controller is outside the cluster,
# so ClusterIPs are unroutable and *.svc.cluster.local does not resolve. Tunnel
# in with `port-forward` and alias the FQDN to loopback.
#
# Inputs:
#   common_internal_https_dns_kubeconfig_path
#   common_internal_https_dns_service_name
#   common_internal_https_dns_service_namespace
#   common_internal_https_dns_fqdn   (defaults to <svc>.<ns>.svc.cluster.local)

- name: Assert internal HTTPS DNS helper inputs
  ansible.builtin.assert:
    that:
      - (common_internal_https_dns_kubeconfig_path | default('') | trim | length) > 0
      - (common_internal_https_dns_service_name | default('') | trim | length) > 0
      - (common_internal_https_dns_service_namespace | default('') | trim | length) > 0
    fail_msg: Missing required inputs for the common internal HTTPS DNS helper.
  when: not ansible_check_mode

- name: Set internal HTTPS DNS derived facts
  ansible.builtin.set_fact:
    _common_internal_https_dns_fqdn: >-
      {{
        common_internal_https_dns_fqdn
        | default(
            common_internal_https_dns_service_name + '.'
            + common_internal_https_dns_service_namespace + '.svc.cluster.local'
          )
      }}
  changed_when: false

- name: Reach the internal HTTPS service through a port-forward tunnel
  when:
    - not ansible_check_mode
  block:
    - name: Resolve the service port to tunnel
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} get service {{ common_internal_https_dns_service_name }}
          --namespace {{ common_internal_https_dns_service_namespace }}
          -o jsonpath={.spec.ports[0].port}
      environment:
        KUBECONFIG: "{{ common_internal_https_dns_kubeconfig_path }}"
      register: _common_internal_https_dns_port
      changed_when: false
      until: (_common_internal_https_dns_port.stdout | trim | length) > 0
      retries: 30
      delay: 2

    - name: Point the internal FQDN at loopback
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ _common_internal_https_dns_fqdn | regex_escape }}\s*$'
        line: "127.0.0.1 {{ _common_internal_https_dns_fqdn }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    # Rebuilt rather than reused: a tunnel left behind by an earlier run may
    # point at a pod that no longer exists, which surfaces much later as a
    # confusing connection or TLS error.
    - name: Drop any stale tunnel for this service
      ansible.builtin.command:
        cmd: >-
          pkill -f
          "port-forward.*{{ common_internal_https_dns_service_namespace }}.*svc/{{ common_internal_https_dns_service_name }}"
      register: _common_internal_https_dns_pkill
      changed_when: _common_internal_https_dns_pkill.rc == 0
      failed_when: false

    # Fire-and-forget: the tunnel must outlive this task and stay up for the rest
    # of the play. common/tasks/stop_port_forwards.yml reaps them at the end.
    - name: Open the port-forward tunnel
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} port-forward
          --address 127.0.0.1
          --namespace {{ common_internal_https_dns_service_namespace }}
          svc/{{ common_internal_https_dns_service_name }}
          {{ _common_internal_https_dns_port.stdout | trim }}:{{ _common_internal_https_dns_port.stdout | trim }}
      environment:
        KUBECONFIG: "{{ common_internal_https_dns_kubeconfig_path }}"
      async: "{{ common_port_forward_ttl_seconds }}"
      poll: 0
      changed_when: true

    - name: Wait for the tunnel to accept connections
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ _common_internal_https_dns_port.stdout | trim | int }}"
        timeout: "{{ common_port_forward_ready_timeout_seconds }}"
