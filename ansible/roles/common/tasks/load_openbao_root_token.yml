---
# BREAK-GLASS ONLY. Day-to-day automation must use
# load_openbao_provisioner_token.yml. Do not add new consumers.
- name: Decrypt OpenBao init keys when root token is undefined
  ansible.builtin.command:
    cmd: >-
      ansible-vault decrypt
      --vault-password-file {{ openbao_vault_pass_file | default(common_openbao_vault_pass_file) }}
      --output -
      {{ openbao_init_keys_file | default(common_openbao_init_keys_file) }}
  # See roles/openbao/tasks/break_glass_mirror.yml for why this is pinned:
  # ANSIBLE_VERBOSITY leaks from .env into this subprocess and, at verbosity
  # >=3, ansible-vault prints a diagnostic banner ahead of the real content on
  # stdout, breaking the from_yaml parse below.
  environment:
    ANSIBLE_VERBOSITY: "0"
  register: _common_openbao_init_keys_decrypted
  changed_when: false
  become: true
  no_log: "{{ not (common_log_nolog | default(false) | bool) }}"
  when:
    - not ansible_check_mode
    - common_openbao_root_token is not defined

- name: Set OpenBao root token fact from decrypted init keys
  ansible.builtin.set_fact:
    common_openbao_root_token: "{{ (_common_openbao_init_keys_decrypted.stdout | from_yaml).root_token }}"
  no_log: "{{ not (common_log_nolog | default(false) | bool) }}"
  when:
    - not ansible_check_mode
    - common_openbao_root_token is not defined

- name: Validate OpenBao root token availability
  ansible.builtin.assert:
    that:
      - common_openbao_root_token is defined
      - (common_openbao_root_token | string | length) > 0
    fail_msg: >-
      OpenBao root token is not available.
      Run with --tags openbao,<target-tag> or ensure vaulted init keys are accessible.
  when: not ansible_check_mode
