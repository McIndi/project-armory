---
- name: Resolve ARMORY_LOG_NOLOG flag
  ansible.builtin.set_fact:
    armory_log_nolog: "{{ (lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true)) | bool }}"
  changed_when: false

# Hard stop before anything cluster-scoped is touched. The manifest install path
# server-side-applies the community Keycloak CRDs, which are cluster-scoped and
# may already be owned by another tenant's OLM-managed operator. Overwriting them
# can break that tenant's SSO, so refuse that path on a platform we do not own
# end to end, however the vars were set.
- name: Refuse to apply cluster-scoped Keycloak CRDs on a platform we do not own
  ansible.builtin.assert:
    that:
      - >-
        (target_platform | default('k3s') == 'k3s')
        or (keycloak_operator_install_method | default('manifests') != 'manifests')
    fail_msg: >-
      keycloak_operator_install_method='manifests' applies the upstream community
      Keycloak CRDs (cluster-scoped), but target_platform is
      '{{ target_platform | default('k3s') }}'. On a shared cluster those CRDs are
      likely owned by an OLM-managed operator that another tenant's Keycloak
      depends on, and overwriting them can break their SSO. Set
      keycloak_operator_install_method=none to run Keycloak as a plain Deployment
      instead, touching no CRDs at all.
    success_msg: >-
      Keycloak operator install method
      '{{ keycloak_operator_install_method | default('manifests') }}' is safe for
      target_platform '{{ target_platform | default('k3s') }}'.
  tags: [keycloak, keycloak_install, keycloak_oidc]

- name: Deploy standalone Keycloak (Operator + PostgreSQL StatefulSet)
  tags: [keycloak, keycloak_install, keycloak_oidc]
  block:
    # ── Namespace ──────────────────────────────────────────────────────────────
    - name: Ensure Keycloak namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ keycloak_namespace }}"
      when: not ansible_check_mode

    # ── OpenBao: generate + persist credentials ─────────────────────────────────
    - name: Ensure OpenBao provisioner token is available
      ansible.builtin.include_role:
        name: common
        tasks_from: load_openbao_provisioner_token.yml

    - name: Read current Keycloak DB credentials from OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_db_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        status_code: [200, 404]
      register: _keycloak_db_creds_current
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Build Keycloak DB credentials (username fixed, password generated once)
      ansible.builtin.set_fact:
        _keycloak_db_creds: >-
          {{
            {
              'username': keycloak_db_username,
              'password': (
                (_keycloak_db_creds_current.json.data.data.password)
                if ((_keycloak_db_creds_current.status | default(404)) == 200
                    and (_keycloak_db_creds_current.json.data.data.password | default('') | length) > 0)
                else lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits')
              )
            }
          }}
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Store Keycloak DB credentials in OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_db_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        body_format: json
        body:
          data: "{{ _keycloak_db_creds }}"
        status_code: [200, 204]
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      # Store only on first creation. The build reuses any existing value, so a
      # re-store would write an identical-data KV version every run and create
      # unnecessary churn in the source of truth.
      when:
        - not ansible_check_mode
        - (_keycloak_db_creds_current.status | default(404)) != 200

    - name: Read current realm-admin password from OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_realm_admin_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        status_code: [200, 404]
      register: _keycloak_realm_admin_current
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Build realm-admin password (generated once, persisted)
      ansible.builtin.set_fact:
        _keycloak_realm_admin_password: >-
          {{
            (_keycloak_realm_admin_current.json.data.data.password)
            if ((_keycloak_realm_admin_current.status | default(404)) == 200
                and (_keycloak_realm_admin_current.json.data.data.password | default('') | length) > 0)
            else lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits')
          }}
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Store realm-admin password in OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_realm_admin_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        body_format: json
        body:
          data:
            username: "{{ keycloak_realm_admin_username }}"
            password: "{{ _keycloak_realm_admin_password }}"
        status_code: [200, 204]
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      # Store only on first creation (see DB-credential note above) — avoids the
      # per-run KV-version churn that bumps keycloak-realm-admin's resourceVersion.
      when:
        - not ansible_check_mode
        - (_keycloak_realm_admin_current.status | default(404)) != 200

    # ── Master bootstrap admin: OpenBao-generated, replaces operator temp-admin ──
    - name: Read current master bootstrap-admin password from OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_bootstrap_admin_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        status_code: [200, 404]
      register: _keycloak_bootstrap_admin_current
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Build master bootstrap-admin password (generated once, persisted)
      ansible.builtin.set_fact:
        _keycloak_bootstrap_admin_password: >-
          {{
            (_keycloak_bootstrap_admin_current.json.data.data.password)
            if ((_keycloak_bootstrap_admin_current.status | default(404)) == 200
                and (_keycloak_bootstrap_admin_current.json.data.data.password | default('') | length) > 0)
            else lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits')
          }}
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Store master bootstrap-admin credentials in OpenBao
      ansible.builtin.uri:
        url: "{{ keycloak_openbao_api_addr }}/v1/{{ keycloak_openbao_kv_mount }}/data/{{ keycloak_openbao_bootstrap_admin_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_provisioner_token }}"
        body_format: json
        body:
          data:
            username: "{{ keycloak_bootstrap_admin_username }}"
            password: "{{ _keycloak_bootstrap_admin_password }}"
        status_code: [200, 204]
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      # Store only on first creation (see DB-credential note above).
      when:
        - not ansible_check_mode
        - (_keycloak_bootstrap_admin_current.status | default(404)) != 200

    # The Secret must exist before the Keycloak CR is applied: the operator reads
    # spec.bootstrapAdmin.user.secret at first creation.
    - name: Apply master bootstrap-admin Secret in the Keycloak namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ keycloak_bootstrap_admin_secret_name }}"
            namespace: "{{ keycloak_namespace }}"
          type: Opaque
          stringData:
            username: "{{ keycloak_bootstrap_admin_username }}"
            password: "{{ _keycloak_bootstrap_admin_password }}"
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    # Materialize the namespace Secrets directly from the OpenBao-backed facts.
    - name: Ensure OpenBao CA secret exists in the Keycloak namespace
      ansible.builtin.import_role:
        name: common
        tasks_from: copy_openbao_ca_secret.yml
      vars:
        common_kubeconfig_path: "{{ keycloak_kubeconfig_path }}"
        common_ca_secret_name: "{{ keycloak_openbao_ca_secret_name }}"
        common_ca_source_namespace: "{{ keycloak_openbao_namespace }}"
        common_ca_target_namespace: "{{ keycloak_namespace }}"

    - name: Apply keycloak-db-secret directly in the Keycloak namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ keycloak_db_secret_name }}"
            namespace: "{{ keycloak_namespace }}"
          type: Opaque
          stringData:
            username: "{{ _keycloak_db_creds.username }}"
            password: "{{ _keycloak_db_creds.password }}"
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Apply keycloak-realm-admin secret directly in the Keycloak namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ keycloak_realm_admin_secret_name }}"
            namespace: "{{ keycloak_namespace }}"
          type: Opaque
          stringData:
            username: "{{ keycloak_realm_admin_username }}"
            password: "{{ _keycloak_realm_admin_password }}"
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when: not ansible_check_mode

    - name: Ensure PostgreSQL TLS certificate exists and is ready
      ansible.builtin.import_role:
        name: common
        tasks_from: apply_certificate.yml
      vars:
        common_kubeconfig_path: "{{ keycloak_kubeconfig_path }}"
        common_certificate_name: "{{ keycloak_pg_tls_certificate_name }}"
        common_certificate_namespace: "{{ keycloak_namespace }}"
        common_certificate_secret_name: "{{ keycloak_pg_tls_secret_name }}"
        common_certificate_issuer_name: "{{ keycloak_pg_tls_issuer_name }}"
        common_certificate_duration: "{{ keycloak_pg_tls_certificate_duration }}"
        common_certificate_renew_before: "{{ keycloak_pg_tls_certificate_renew_before }}"
        common_certificate_common_name: "{{ keycloak_pg_tls_common_name | default('') }}"
        common_certificate_dns_names: "{{ keycloak_pg_tls_dns_names }}"
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    # ── PostgreSQL StatefulSet ──────────────────────────────────────────────────
    # The manifest differs by platform, not just by values: OpenShift needs an
    # image that runs as an arbitrary UID, which changes the env vars, the data
    # directory, and how server config is supplied. Selecting a whole template
    # keeps each one readable and keeps the k3s manifest untouched.
    - name: Apply PostgreSQL StatefulSet and Service
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', keycloak_pg_manifest_template) | from_yaml_all | list }}"
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool

    - name: Wait for PostgreSQL StatefulSet rollout
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} rollout status statefulset/{{ keycloak_pg_service }}
          --namespace {{ keycloak_namespace }}
          --timeout={{ keycloak_pg_rollout_timeout_seconds }}s
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_pg_rollout
      changed_when: false
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool

    - name: Prepare Postgres CA bundle for Keycloak verify-full DB TLS
      ansible.builtin.import_role:
        name: common
        tasks_from: prepare_internal_https_caller.yml
      vars:
        common_internal_https_kubeconfig_path: "{{ keycloak_kubeconfig_path }}"
        common_internal_https_service_name: "{{ keycloak_pg_service }}"
        common_internal_https_service_namespace: "{{ keycloak_namespace }}"
        common_internal_https_fqdn: "{{ keycloak_pg_service_fqdn }}"
        common_internal_https_openbao_cluster_addr: "{{ keycloak_openbao_cluster_addr }}"
        common_internal_https_openbao_ca_secret_name: "{{ keycloak_pg_tls_ca_secret_name }}"
        common_internal_https_ca_source_namespace: "{{ keycloak_namespace }}"
        common_internal_https_bundle_path: "{{ keycloak_pg_tls_ca_bundle_path }}"
        common_internal_https_openbao_pki_mount: "{{ openbao_pki_internal_mount | default('pki-int') }}"
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    # The bundle is written root-owned by the common prepare task (under become),
    # so it must be read by a module that runs on the target under become — a
    # controller-side lookup('file', …) runs as the unprivileged user and is
    # denied. slurp reads it as root; b64decode inlines the PEM into the ConfigMap.
    - name: Read Postgres CA bundle for ConfigMap (privileged read under become)
      ansible.builtin.slurp:
        src: "{{ keycloak_pg_tls_ca_bundle_path }}"
      register: _keycloak_pg_ca_bundle
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    - name: Apply Keycloak Postgres CA ConfigMap
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ keycloak_pg_tls_ca_configmap_name }}"
            namespace: "{{ keycloak_namespace }}"
          # The data key is variable-named; build the dict in one Jinja
          # expression so the KEY is evaluated (Ansible does not template dict keys).
          data: "{{ {keycloak_pg_tls_ca_file_name: (_keycloak_pg_ca_bundle.content | b64decode)} }}"
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    - name: Remove temporary Keycloak Postgres CA bundle file
      ansible.builtin.file:
        path: "{{ keycloak_pg_tls_ca_bundle_path }}"
        state: absent
      changed_when: false
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    - name: Remove temporary Postgres FQDN hosts override for DB TLS bootstrap
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^.*\s+{{ keycloak_pg_service_fqdn | regex_escape }}(\s|$)'
        state: absent
      become: true
      when:
        - not ansible_check_mode
        - keycloak_postgresql_enabled | bool
        - keycloak_pg_tls_enabled | bool

    # ── Keycloak Operator: CRDs + operator Deployment ───────────────────────────
    # These CRDs are CLUSTER-SCOPED. Applying them is only safe where armory owns
    # the cluster outright. Where the platform already provides a Keycloak
    # operator via OLM (keycloak_operator_install_method: olm), another tenant's
    # Keycloak may depend on these exact CRDs — server-side-applying the upstream
    # community copies over theirs can mutate the schema and break their SSO.
    - name: Install Keycloak CRDs (cluster-scoped, pinned version)
      ansible.builtin.command:
        cmd: "{{ kubectl_bin }} apply --server-side -f {{ keycloak_k8s_resources_base_url }}/{{ item }}"
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      loop:
        - "{{ keycloak_crd_keycloaks }}-v1.yml"
        - "{{ keycloak_crd_realmimports }}-v1.yml"
      register: _keycloak_crd_apply
      changed_when: >-
        'configured' in (_keycloak_crd_apply.stdout | default('')) or
        'created' in (_keycloak_crd_apply.stdout | default(''))
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Wait for Keycloak CRDs to be established
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} wait --for=condition=Established
          crd/{{ item }} --timeout=120s
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      loop:
        - "{{ keycloak_crd_keycloaks }}"
        - "{{ keycloak_crd_realmimports }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Read current Keycloak Operator deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        kind: Deployment
        namespace: "{{ keycloak_namespace }}"
        name: "{{ keycloak_operator_deployment_name }}"
      register: _keycloak_operator_deployment
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Install Keycloak Operator into the Keycloak namespace
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} apply -n {{ keycloak_namespace }}
          -f {{ keycloak_k8s_resources_base_url }}/kubernetes.yml
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_operator_apply
      changed_when: >-
        'configured' in (_keycloak_operator_apply.stdout | default('')) or
        'created' in (_keycloak_operator_apply.stdout | default(''))
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'
        - >-
          (_keycloak_operator_deployment.resources | default([]) | length == 0) or
          (
            _keycloak_operator_deployment.resources[0].metadata.labels['app.kubernetes.io/version'] | default('')
            != keycloak_operator_version
          )

    # The upstream operator Deployment ships a short startup probe
    # (delay 5s + 3x10s ~= 35s) and a 700m CPU limit. On slow/CPU-throttled
    # hosts the Quarkus operator boots in ~45s+, so kubelet kills it before it
    # listens, causing an endless restart loop. Raise the startup window and
    # CPU limit so the operator can finish booting.
    - name: Patch Keycloak Operator startup probe and CPU for slow-JVM hosts
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} patch deployment {{ keycloak_operator_deployment_name }}
          --namespace {{ keycloak_namespace }}
          --type=strategic
          --patch
          {{ ({
               "spec": {
                 "template": {
                   "spec": {
                     "containers": [{
                       "name": keycloak_operator_deployment_name,
                       "startupProbe": {"failureThreshold": keycloak_operator_startup_probe_failurethreshold},
                       "resources": {"limits": {"cpu": keycloak_operator_cpu_limit}}
                     }]
                   }
                 }
               }
             }) | to_json | quote }}
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_operator_patch
      changed_when: "'(no change)' not in (_keycloak_operator_patch.stdout | default(''))"
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Wait for Keycloak Operator deployment to be available
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} rollout status deployment/{{ keycloak_operator_deployment_name }}
          --namespace {{ keycloak_namespace }}
          --timeout={{ keycloak_operator_rollout_timeout_seconds }}s
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_operator_rollout
      changed_when: false
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Provision Keycloak internal service TLS certificate
      ansible.builtin.import_role:
        name: common
        tasks_from: apply_certificate.yml
      vars:
        common_kubeconfig_path: "{{ keycloak_kubeconfig_path }}"
        common_certificate_name: "{{ keycloak_internal_tls_certificate_name }}"
        common_certificate_namespace: "{{ keycloak_namespace }}"
        common_certificate_secret_name: "{{ keycloak_internal_tls_secret_name }}"
        common_certificate_issuer_name: "{{ keycloak_internal_tls_issuer_name }}"
        common_certificate_duration: "{{ keycloak_internal_tls_certificate_duration }}"
        common_certificate_renew_before: "{{ keycloak_internal_tls_certificate_renew_before }}"
        common_certificate_dns_names: "{{ keycloak_internal_tls_dns_names }}"
      when:
        - not ansible_check_mode

    # ── Server: operator-less ───────────────────────────────────────────────────
    # Where the Keycloak CRDs belong to another tenant, run the server as a plain
    # Deployment instead of a Keycloak CR. Produces the same Service name and the
    # same realm, so everything downstream is unaffected.
    - name: Deploy Keycloak without the operator
      ansible.builtin.include_tasks: deploy_operatorless.yml
      when:
        - keycloak_operator_install_method | default('manifests') != 'manifests'
        - not ansible_check_mode

    - name: Expose Keycloak through the edge
      ansible.builtin.include_tasks: route.yml
      when:
        - edge_kind | default('httproute') == 'route'
        - not ansible_check_mode

    # ── Keycloak custom resource ────────────────────────────────────────────────
    - name: Apply Keycloak custom resource
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'keycloak.yaml.j2') | from_yaml_all | list }}"
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Wait for Keycloak custom resource to become Ready
      block:
        - name: Wait for Keycloak custom resource to become Ready (initial)
          ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} wait --for=condition=Ready
              keycloak/{{ keycloak_cr_name }}
              --namespace {{ keycloak_namespace }}
              --timeout={{ keycloak_ready_timeout_seconds }}s
          environment:
            KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
          register: _keycloak_cr_ready
          changed_when: false
      rescue:
        - name: Read Keycloak StatefulSet rollout revisions
          ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} get statefulset/{{ keycloak_cr_name }}
              --namespace {{ keycloak_namespace }}
              -o jsonpath='{.status.currentRevision} {.status.updateRevision}'
          environment:
            KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
          register: _keycloak_statefulset_revisions
          changed_when: false

        - name: Force restart Keycloak StatefulSet when its revision is stale
          ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} rollout restart statefulset/{{ keycloak_cr_name }}
              --namespace {{ keycloak_namespace }}
          environment:
            KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
          register: _keycloak_force_restart
          changed_when: >-
            'restarted' in (_keycloak_force_restart.stdout | default(''))
          when: >-
            (_keycloak_statefulset_revisions.stdout | default('') | trim | length) > 0 and
            (_keycloak_statefulset_revisions.stdout.split() | length) == 2 and
            (_keycloak_statefulset_revisions.stdout.split()[0] != _keycloak_statefulset_revisions.stdout.split()[1])

        - name: Wait for Keycloak StatefulSet rollout after forced restart
          ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} rollout status statefulset/{{ keycloak_cr_name }}
              --namespace {{ keycloak_namespace }}
              --timeout={{ keycloak_statefulset_rollout_timeout_seconds }}s
          environment:
            KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
          register: _keycloak_cr_rollout_recovery
          changed_when: false
          when: _keycloak_force_restart is defined and (_keycloak_force_restart is changed)

        - name: Wait for Keycloak custom resource to become Ready (recovery)
          ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} wait --for=condition=Ready
              keycloak/{{ keycloak_cr_name }}
              --namespace {{ keycloak_namespace }}
              --timeout={{ keycloak_ready_timeout_seconds }}s
          environment:
            KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
          register: _keycloak_cr_ready
          changed_when: false
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    # ── Realm import ────────────────────────────────────────────────────────────
    # Operator path only. Without the operator the same realm body is imported by
    # Keycloak itself at first boot (--import-realm), from the Secret staged in
    # deploy_operatorless.yml.
    - name: Apply Keycloak realm import
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'realmimport.yaml.j2') | from_yaml_all | list }}"
      no_log: "{{ not (armory_log_nolog | default(false) | bool) }}"
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    - name: Wait for Keycloak realm import to complete
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} wait --for=condition=Done
          keycloakrealmimport/{{ keycloak_realm }}-realm
          --namespace {{ keycloak_namespace }}
          --timeout={{ keycloak_ready_timeout_seconds }}s
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_realm_done
      changed_when: false
      when:
        - not ansible_check_mode
        - keycloak_operator_install_method | default('manifests') == 'manifests'

    # Gate realm reconciliation on a settled workload. On a fresh deploy the
    # DB Secret, the server bootstrap, and the admin-REST calls below all need a
    # stable target, so wait until the rollout is complete before reconciling.
    # The operator renders a StatefulSet; the operator-less path a Deployment.
    # The race this guards against is the same either way, so the workload kind
    # is a variable rather than the task being duplicated.
    - name: Wait for Keycloak rollout before realm reconciliation
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} rollout status {{ keycloak_workload_kind }}/{{ keycloak_cr_name }}
          --namespace {{ keycloak_namespace }}
          --timeout={{ keycloak_statefulset_rollout_timeout_seconds }}s
      environment:
        KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
      register: _keycloak_statefulset_rollout
      changed_when: false
      when: not ansible_check_mode

    - name: Ensure configured Keycloak realm groups exist via admin REST
      ansible.builtin.include_tasks: realm_groups.yml
      when: not ansible_check_mode

    - name: Reconcile configured Keycloak realm users via admin REST
      ansible.builtin.include_tasks: realm_users.yml
      when: not ansible_check_mode

    - name: Reconcile Keycloak realm event auditing config via admin REST
      ansible.builtin.include_tasks: realm_events.yml
      when: not ansible_check_mode

    # ── Public route (edge TLS at the Envoy gateway) ────────────────────────────
    - name: Mirror Keycloak serving CA into BackendTLSPolicy ConfigMap
      ansible.builtin.import_role:
        name: common
        tasks_from: apply_backend_ca_configmap.yml
      vars:
        common_kubeconfig_path: "{{ keycloak_kubeconfig_path }}"
        common_backend_ca_namespace: "{{ keycloak_namespace }}"
        common_backend_ca_secret_name: "{{ keycloak_internal_tls_secret_name }}"
        common_backend_ca_configmap_name: "{{ keycloak_backend_ca_configmap }}"
      when: keycloak_ingress_enabled | bool

    - name: Apply Keycloak HTTPRoute and BackendTLSPolicy
      kubernetes.core.k8s:
        kubeconfig: "{{ keycloak_kubeconfig_path }}"
        state: present
        definition: "{{ lookup('template', 'httproute.yaml.j2') | from_yaml_all | list }}"
      when:
        - not ansible_check_mode
        - keycloak_ingress_enabled | bool

    - name: Provision Keycloak admin-events retention prune timer
      ansible.builtin.import_tasks: admin_events_prune.yml
      when:
        - not ansible_check_mode
        - keycloak_admin_events_prune_enabled | bool
  when: not ansible_check_mode
