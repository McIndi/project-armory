---
- name: Register Keycloak namespace for teardown checks
  ansible.builtin.set_fact:
    keycloak_teardown_target_namespaces: >-
      {{ ((keycloak_teardown_target_namespaces | default([])) + [keycloak_namespace]) | unique }}

- name: Delete Keycloak Deployment (ignore if absent)
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} delete deployment {{ keycloak_deployment_name }}
      -n {{ keycloak_namespace }} --ignore-not-found --timeout=120s
  environment:
    KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
  register: _keycloak_td_deploy
  changed_when: "'deleted' in (_keycloak_td_deploy.stdout | default(''))"
  failed_when: false

- name: Delete Keycloak Service (ignore if absent)
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} delete service {{ keycloak_service_name }}
      -n {{ keycloak_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
  register: _keycloak_td_service
  changed_when: "'deleted' in (_keycloak_td_service.stdout | default(''))"
  failed_when: false

- name: Delete Keycloak realm import Secret (ignore if absent)
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} delete secret {{ keycloak_realm_import_secret_name }}
      -n {{ keycloak_namespace }} --ignore-not-found
  environment:
    KUBECONFIG: "{{ keycloak_kubeconfig_path }}"
  register: _keycloak_td_realm_secret
  changed_when: "'deleted' in (_keycloak_td_realm_secret.stdout | default(''))"
  failed_when: false
