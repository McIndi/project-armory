---
# When true, enables standalone Keycloak deployment and bootstrap tasks.
keycloak_enabled: false

# ── General ───────────────────────────────────────────────────────────────────
keycloak_kubeconfig_path: "{{ armory_kubeconfig_path | default(lookup('ansible.builtin.env', 'KUBECONFIG'), true) }}"
keycloak_work_dir: /opt/keycloak

# ── Keycloak server (operatorless-only) ───────────────────────────────────────
# The OpenShift-isolated branch always deploys Keycloak as a plain Deployment
# (no operator, no Keycloak CRDs).

# Server image, operator-less path only (the operator picks its own).
keycloak_image: "quay.io/keycloak/keycloak:26.5.2"

# Keycloak's management interface (health/metrics). Inherits the HTTPS config
# from the main interface once KC_HTTPS_* is set.
keycloak_management_port: 9000

# Where the server TLS keypair is mounted, operator-less path.
keycloak_tls_mount_path: /opt/keycloak/conf/tls

# Secret holding the realm definition Keycloak imports at first boot. A Secret,
# not a ConfigMap: the realm body embeds the realm admin password in cleartext.
keycloak_realm_import_secret_name: keycloak-realm-import

# Startup can take a while on a cold JVM with a fresh DB migration.
keycloak_startup_probe_failure_threshold: 60

keycloak_resources_requests_cpu: 500m
keycloak_resources_requests_memory: 1Gi
keycloak_resources_limits_cpu: "2"
keycloak_resources_limits_memory: 2Gi
keycloak_deployment_rollout_timeout_seconds: 600

# ── Keycloak deployment identity ───────────────────────────────────────────────
keycloak_deployment_name: keycloak
keycloak_instances: 1
# Service name is intentionally preserved for downstream compatibility.
keycloak_service_name: "{{ keycloak_deployment_name }}-service"
keycloak_service_port: 8080
keycloak_service_https_port: 8443

# ── Master bootstrap admin (OpenBao-generated) ──────────────────────────────────
# Bootstrap admin is provisioned from OpenBao-generated credentials. The
# Deployment consumes this Secret via KC_BOOTSTRAP_ADMIN_* env vars.
keycloak_bootstrap_admin_secret_name: keycloak-bootstrap-admin
keycloak_bootstrap_admin_username: armory-admin
keycloak_openbao_bootstrap_admin_path: keycloak/bootstrap-admin
# Loosen hostname strict mode so in-cluster callers (Headlamp admin REST on the
# ClusterIP service) are not redirected to the public host. Equivalent to the
# old KC_HOSTNAME_STRICT=false patch.
keycloak_hostname_strict: false
# Timeout (seconds) waiting for Keycloak availability (cold-JVM start).
keycloak_ready_timeout_seconds: 900
keycloak_statefulset_rollout_timeout_seconds: 900

# ── Public URL / realm ──────────────────────────────────────────────────────────
keycloak_public_base_url: "{{ lookup('ansible.builtin.env', 'ARMORY_PUBLIC_BASE_URL') | default('https://armory.local', true) }}"
keycloak_public_host: "{{ keycloak_public_base_url | urlsplit('hostname') }}"
keycloak_realm: armory

# ── Public route ────────────────────────────────────────────────────────────────
# Keycloak is reachable through the cluster ingress domain.
keycloak_ingress_enabled: true
keycloak_ingress_host: "{{ keycloak_public_host }}"

# ── Realm seed: admin end-user (logs into Headlamp; bound to cluster-admin by k3s) ─
# This is a realm user, distinct from the operator's master bootstrap admin.
keycloak_realm_admin_username: admin
keycloak_realm_admin_email: "{{ lookup('ansible.builtin.env', 'ARMORY_ADMIN_EMAIL') | default('admin@armory.dev', true) }}"
keycloak_realm_admin_first_name: Admin
keycloak_realm_admin_last_name: User
keycloak_admin_group: armory-admins
keycloak_realm_groups:
  - "{{ keycloak_admin_group }}"
  - armory-operators
  - armory-viewers
keycloak_realm_users:
  - username: "{{ keycloak_realm_admin_username }}"
    email: "{{ keycloak_realm_admin_email }}"
    first_name: "{{ keycloak_realm_admin_first_name }}"
    last_name: "{{ keycloak_realm_admin_last_name }}"
    groups:
      - "{{ keycloak_admin_group }}"
    openbao_path: "{{ keycloak_openbao_realm_admin_path }}"
  - username: operator
    email: "{{ lookup('ansible.builtin.env', 'ARMORY_OPERATOR_EMAIL') | default('operator@armory.dev', true) }}"
    first_name: Operator
    last_name: User
    groups:
      - armory-operators
    openbao_path: keycloak/realm-users/operator
  - username: viewer
    email: "{{ lookup('ansible.builtin.env', 'ARMORY_VIEWER_EMAIL') | default('viewer@armory.dev', true) }}"
    first_name: Viewer
    last_name: User
    groups:
      - armory-viewers
    openbao_path: keycloak/realm-users/viewer

# ── Event auditing (Tier 1 store + Tier 2 log stream) ───────────────────────────
keycloak_events_enabled: true
keycloak_events_expiration_seconds: 7776000   # 90 days; user events only
keycloak_events_listeners:
  - jboss-logging
keycloak_admin_events_enabled: true
keycloak_admin_events_details_enabled: true
keycloak_events_jboss_logging_success_level: info
keycloak_events_jboss_logging_error_level: warn

# Admin events have no server-side expiration; a scheduled CronJob prunes the
# admin_event_entity table by age.
keycloak_admin_events_prune_enabled: true
keycloak_admin_events_prune_keep_days: 90

# cronjob form: cron schedule, exec SA, and a kubectl-capable image.
keycloak_admin_events_prune_cron_schedule: "23 3 * * 0"
keycloak_admin_events_prune_sa_name: keycloak-admin-events-prune
keycloak_admin_events_prune_image: "docker.io/bitnami/kubectl:1.33"

# ── PostgreSQL StatefulSet (single-node backing store) ───────────────────────────
keycloak_postgresql_enabled: true
keycloak_pg_image: "quay.io/sclorg/postgresql-16-c9s"
keycloak_pg_service: postgres
keycloak_db_name: keycloak
keycloak_db_username: keycloak

# Where the server TLS material is mounted (OpenShift manifest).
keycloak_pg_tls_mount_path: /etc/postgresql/tls
keycloak_pg_storage_size: "8Gi"
# Empty = use the cluster default StorageClass.
keycloak_pg_storage_class: ""
keycloak_pg_rollout_timeout_seconds: 300

# ── OpenBao-backed credentials ─────────────────────────────────────────────────
keycloak_openbao_api_addr: "{{ openbao_api_addr | default('https://openbao.openbao.svc.cluster.local:8200') }}"
keycloak_openbao_cluster_addr: "{{ openbao_cluster_addr | default('https://openbao.openbao.svc.cluster.local:8200') }}"
keycloak_openbao_kv_mount: "{{ openbao_kv_mount | default('secret') }}"
keycloak_openbao_tls_server_name: "{{ openbao_tls_server_name | default('openbao.openbao.svc.cluster.local') }}"
keycloak_openbao_ca_secret_name: "{{ openbao_tls_ca_secret_name | default('openbao-ca') }}"
keycloak_openbao_namespace: "{{ openbao_namespace | default('openbao') }}"

# KV path: bootstrap-admin is read by Ansible only (injected into the bootstrap
# secret), never synced to a k8s Secret.

keycloak_db_secret_name: keycloak-db-secret
keycloak_realm_admin_secret_name: keycloak-realm-admin

# Internal TLS for in-cluster service-to-service Keycloak API traffic.
keycloak_internal_tls_secret_name: keycloak-internal-tls
keycloak_internal_tls_certificate_name: "{{ keycloak_internal_tls_secret_name }}"
keycloak_internal_tls_issuer_name: "{{ certmanager_openbao_internal_clusterissuer_name | default('openbao-pki-internal') }}"
keycloak_internal_tls_certificate_duration: "{{ openbao_pki_cert_ttl | default('8760h') }}"
keycloak_internal_tls_certificate_renew_before: 720h
keycloak_internal_tls_dns_names:
  - "{{ keycloak_service_name }}.{{ keycloak_namespace }}.svc.cluster.local"

# Canonical in-cluster Keycloak service FQDN for internal HTTPS callers.
keycloak_internal_service_fqdn: "{{ keycloak_service_name }}.{{ keycloak_namespace }}.svc.cluster.local"

# In-cluster Keycloak endpoint used by the realm-admin rotator CronJob.
keycloak_internal_api_url: "https://{{ keycloak_internal_service_fqdn }}:{{ keycloak_service_https_port }}"

# Backward-compatible alias retained for older template references.
keycloak_internal_http_url: "{{ keycloak_internal_api_url }}"

# PostgreSQL TLS (Keycloak -> Postgres) defaults.
keycloak_pg_tls_enabled: false
keycloak_pg_tls_verify_mode: verify-full
keycloak_pg_service_fqdn: "{{ keycloak_pg_service }}.{{ keycloak_namespace }}.svc.cluster.local"
keycloak_pg_host: "{{ keycloak_pg_service_fqdn if (keycloak_pg_tls_enabled | bool) else keycloak_pg_service }}"
keycloak_pg_tls_secret_name: keycloak-postgres-tls
keycloak_pg_tls_certificate_name: "{{ keycloak_pg_tls_secret_name }}"
keycloak_pg_tls_certificate_duration: "{{ openbao_pki_cert_ttl | default('8760h') }}"
keycloak_pg_tls_certificate_renew_before: 720h
keycloak_pg_tls_issuer_name: "{{ certmanager_openbao_internal_clusterissuer_name | default('openbao-pki-internal') }}"
keycloak_pg_tls_common_name: ""
keycloak_pg_tls_dns_names:
  - "{{ keycloak_pg_service_fqdn }}"
keycloak_pg_tls_ca_secret_name: "{{ keycloak_openbao_ca_secret_name }}"
keycloak_pg_tls_ca_bundle_path: /tmp/keycloak-postgres-ca-bundle.crt
keycloak_pg_tls_ca_configmap_name: keycloak-postgres-ca
keycloak_pg_tls_ca_mount_path: "/opt/keycloak/conf/truststores/configmap-{{ keycloak_pg_tls_ca_configmap_name }}"
keycloak_pg_tls_ca_file_name: ca-bundle.crt
keycloak_pg_tls_init_image: "{{ keycloak_pg_image }}"

# When true, disables Ansible no_log redaction for sensitive tasks.
# WARNING: enabling this prints secrets/tokens into logs and output.
armory_log_nolog: "{{ lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true) | bool }}"
