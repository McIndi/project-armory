---
# Mirror the OpenBao break-glass files into a cluster Secret.
#
# WHY this exists: on an ephemeral controller (a workstation that can be rebuilt),
# the local break-glass files are the only copy of the unseal keys and root
# token. Losing the controller would make a running OpenBao permanently
# un-unsealable. Holding a copy in the cluster (etcd, encrypted at rest, gated by
# namespace RBAC) survives that.
#
# THE TRADEOFF, stated plainly: anyone who can read Secrets in the OpenBao
# namespace can now obtain the root token. That is a real widening of custody --
# it is a deliberate choice, not a free win. Set
# openbao_break_glass_k8s_secret_enabled=false to keep the keys off the cluster,
# and take responsibility for backing up the local files another way.
#
# This does NOT solve unseal-on-restart: OpenBao still comes up sealed after any
# pod reschedule and is unsealed by re-running this role. Durable auto-unseal
# (transit/KMS) is a separate decision.

- name: Mirror OpenBao break-glass material into the cluster Secret
  when:
    - openbao_break_glass_k8s_secret_enabled | default(false) | bool
    - not ansible_check_mode
  block:
    - name: Check the local break-glass files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ openbao_vault_pass_file }}"
        - "{{ openbao_init_keys_file }}"
      loop_control:
        label: "{{ item }}"
      register: _openbao_bg_files

    - name: Read the local break-glass files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ openbao_vault_pass_file }}"
        - "{{ openbao_init_keys_file }}"
      loop_control:
        label: "{{ item }}"
      register: _openbao_bg_slurp
      no_log: "{{ not (openbao_log_nolog | default(false) | bool) }}"
      when: _openbao_bg_files.results | map(attribute='stat.exists') | select | list | length == 2

    # The unseal watcher needs the shards directly: decrypting in-cluster would
    # mean shipping ansible-vault into the container for no security gain, since
    # the password sits in this very Secret alongside the ciphertext. Extracting
    # them here keeps the watcher a tiny script and adds no exposure — anyone who
    # could read this Secret could already decrypt it.
    - name: Extract the unseal shards for the watcher
      ansible.builtin.command:
        cmd: >-
          ansible-vault decrypt
          --vault-password-file {{ openbao_vault_pass_file }}
          --output -
          {{ openbao_init_keys_file }}
      # ansible-vault is a CLI that honors ANSIBLE_VERBOSITY same as
      # ansible-playbook itself. .env sets ANSIBLE_VERBOSITY=3 for the outer
      # run, and that leaks into this subprocess's environment, so at that
      # verbosity ansible-vault prints its own diagnostic banner (config file,
      # module locations, python/jinja/pyyaml versions, ...) to stdout ahead
      # of the decrypted content. That banner then gets captured alongside the
      # real YAML below and breaks the from_yaml parse. Pin this one
      # subprocess to verbosity 0 so stdout is always exactly the decrypted
      # file, independent of whatever verbosity the outer run is using.
      environment:
        ANSIBLE_VERBOSITY: "0"
      register: _openbao_bg_decrypted
      changed_when: false
      no_log: "{{ not (openbao_log_nolog | default(false) | bool) }}"
      when:
        - openbao_unseal_watcher_enabled | default(false) | bool
        - _openbao_bg_files.results | map(attribute='stat.exists') | select | list | length == 2

    - name: Write the break-glass Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ openbao_kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ openbao_break_glass_secret_name }}"
            namespace: "{{ openbao_namespace }}"
            labels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/part-of: armory
            annotations:
              armory.io/description: >-
                OpenBao break-glass: ansible-vault password, the vault-encrypted
                unseal keys + root token, and (when the unseal watcher is on) the
                bare unseal shards. Restricted to namespace-admin reads. Handle
                as root-equivalent.
          type: Opaque
          data: >-
            {{
              {
                'vault-pass': _openbao_bg_slurp.results[0].content,
                'init-keys.yml': _openbao_bg_slurp.results[1].content,
              } | combine(
                {
                  'unseal-keys.json': (
                    (_openbao_bg_decrypted.stdout | from_yaml).unseal_keys
                    | to_json | b64encode
                  )
                } if (openbao_unseal_watcher_enabled | default(false) | bool) else {}
              )
            }}
      no_log: "{{ not (openbao_log_nolog | default(false) | bool) }}"
      when: _openbao_bg_files.results | map(attribute='stat.exists') | select | list | length == 2
