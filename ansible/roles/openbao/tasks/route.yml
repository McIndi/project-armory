---
# Public route for the OpenBao UI. Lives in this role (the route belongs to
# the workload) but is invoked from openbao_oidc: the openbao role itself runs
# before the edge exists on a fresh cluster, and the UI is exposed for the OIDC
# login flow.
#
# Both edges terminate TLS at the edge and RE-ENCRYPT to OpenBao's HTTPS
# listener, verifying the backend against the OpenBao server CA rather than
# trusting it blindly. Only the object model differs:
#
#   httproute — Gateway API HTTPRoute + BackendTLSPolicy (Envoy Gateway, k3s)
#   route     — OpenShift Route, termination: reencrypt

- name: Expose OpenBao through the Gateway API edge
  when: edge_kind | default('httproute') == 'httproute'
  block:
    - name: Mirror OpenBao server CA into BackendTLSPolicy ConfigMap
      ansible.builtin.import_role:
        name: common
        tasks_from: apply_backend_ca_configmap.yml
      vars:
        common_kubeconfig_path: "{{ openbao_kubeconfig_path }}"
        common_backend_ca_namespace: "{{ openbao_namespace }}"
        common_backend_ca_secret_name: "{{ openbao_tls_ca_secret_name }}"
        common_backend_ca_configmap_name: "{{ openbao_backend_ca_configmap }}"

    - name: Apply OpenBao UI HTTPRoute and BackendTLSPolicy
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'httproute.yaml.j2') | from_yaml_all | list }}"
        kubeconfig: "{{ openbao_kubeconfig_path }}"
      when: not ansible_check_mode

- name: Expose OpenBao through an OpenShift Route
  when:
    - edge_kind | default('httproute') == 'route'
    - not ansible_check_mode
  block:
    # A Route carries the backend CA inline (destinationCACertificate) rather
    # than referencing a ConfigMap the way BackendTLSPolicy does, so read the CA
    # out of the secret cert-manager wrote and hand it to the template.
    - name: Read the OpenBao server CA for the Route's backend verification
      kubernetes.core.k8s_info:
        kubeconfig: "{{ openbao_kubeconfig_path }}"
        kind: Secret
        name: "{{ openbao_tls_ca_secret_name }}"
        namespace: "{{ openbao_namespace }}"
      register: _openbao_route_ca_secret
      until: >-
        (_openbao_route_ca_secret.resources | default([]) | length > 0)
        and ((_openbao_route_ca_secret.resources[0].data['ca.crt'] | default('')) | length > 0)
      retries: 30
      delay: 2

    - name: Set the Route destination CA fact
      ansible.builtin.set_fact:
        openbao_route_destination_ca: >-
          {{ _openbao_route_ca_secret.resources[0].data['ca.crt'] | b64decode | trim }}
      changed_when: false

    - name: Assert the Route destination CA is PEM
      ansible.builtin.assert:
        that:
          - "'BEGIN CERTIFICATE' in openbao_route_destination_ca"
        fail_msg: >-
          Secret '{{ openbao_tls_ca_secret_name }}' in namespace
          '{{ openbao_namespace }}' does not contain a PEM CA in ca.crt; the
          Route cannot verify the OpenBao backend without it.

    - name: Apply the OpenBao UI Route
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'route.yaml.j2') | from_yaml_all | list }}"
        kubeconfig: "{{ openbao_kubeconfig_path }}"
