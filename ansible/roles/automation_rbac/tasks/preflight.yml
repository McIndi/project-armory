---
# Sample one namespace/resource/verb combination from each RBAC rule the
# automation account needs, BEFORE the run starts.
#
# Without this, a missing grant surfaces as a failure partway through a deploy,
# indistinguishable from a genuine bug in the thing that failed. This turns a
# denied sample into an up-front error naming the exact verb, resource and
# namespace.
#
# It expands the same rule lists that generate the Roles, so a declared rule and
# its sample cannot drift apart. It does not detect out-of-band edits within a
# live Role or variation within a resourceNames-scoped rule.

- name: Verify the automation account's permissions
  when:
    - not ansible_check_mode
    - automation_rbac_preflight_enabled | bool
  block:
    # Flatten the matrix into one check per (namespace, resource, verb). Only the
    # first verb of each rule is probed: RBAC grants a rule's verbs together, so
    # probing every verb multiplies API calls without adding signal.
    - name: Expand the namespaced permission checklist
      ansible.builtin.set_fact:
        _automation_rbac_ns_checks: >-
          {{ _automation_rbac_ns_checks | default([]) + [{
               'namespace': item.0,
               'group': (item.1.apiGroups | first),
               'resource': (item.1.resources | first),
               'verb': (item.1.verbs | first)
             }] }}
      loop: "{{ automation_rbac_managed_namespaces | product(automation_rbac_namespace_rules) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1.resources | first }}"
      changed_when: false

    - name: Expand the cluster-scoped permission checklist
      ansible.builtin.set_fact:
        _automation_rbac_cluster_checks: >-
          {{ _automation_rbac_cluster_checks | default([]) + [{
               'namespace': '',
               'group': (item.apiGroups | first),
               'resource': (item.resources | first),
               'verb': (item.verbs | first)
             }] }}
      loop: "{{ automation_rbac_cluster_rules }}"
      loop_control:
        label: "{{ item.resources | first }}"
      changed_when: false

    # The kube-public check below MUST include the resource name: the grant it
    # tests (automation_rbac_kube_public_rules) is restricted via resourceNames
    # to one object. Kubernetes RBAC never grants the unscoped "any configmap"
    # case for a resourceNames-restricted rule, so a can-i query without the
    # name would correctly report "no" for a permission the account actually
    # has — a false failure, not a real gap.
    - name: Expand the foreign-namespace permission checklist
      ansible.builtin.set_fact:
        _automation_rbac_foreign_checks:
          - namespace: "{{ automation_rbac_certmanager_namespace }}"
            group: ""
            resource: secrets
            verb: create
            resource_name: ""
          - namespace: "{{ automation_rbac_kube_public_namespace }}"
            group: ""
            resource: configmaps
            verb: get
            resource_name: kube-root-ca.crt
      changed_when: false

    # `--as` requires the caller to hold `impersonate` rights on the target
    # identity. During bootstrap.yml we're cluster-admin checking a DIFFERENT
    # identity (the automation SA), so impersonation is correct and necessary.
    # During site.yml's own preflight we're already authenticated AS that SA
    # (armory_privileged_tasks: false) — self-impersonating would require an
    # `impersonate` grant this account deliberately does not have, and every
    # check would fail on the impersonation itself rather than the resource
    # being tested. Omit --as in that case; the active identity IS the one
    # being checked.
    - name: Check each permission against the API server
      ansible.builtin.command:
        cmd: >-
          {{ kubectl_bin }} auth can-i {{ item.verb }}
          {{ item.resource }}{{ ('.' + item.group) if (item.group | length) > 0 else '' }}{{ ('/' + item.resource_name) if (item.resource_name | default('') | length) > 0 else '' }}
          {{ ('--namespace ' + item.namespace) if (item.namespace | length) > 0 else '--all-namespaces' }}
          {{ ('--as=system:serviceaccount:' + automation_rbac_sa_namespace + ':' + automation_rbac_sa_name)
             if (armory_privileged_tasks | default(true) | bool) else '' }}
      environment:
        KUBECONFIG: "{{ automation_rbac_kubeconfig_path }}"
      loop: "{{ _automation_rbac_ns_checks + _automation_rbac_cluster_checks + _automation_rbac_foreign_checks }}"
      loop_control:
        label: "{{ item.verb }} {{ item.resource }} {{ ('in ' + item.namespace) if (item.namespace | length) > 0 else '(cluster)' }}"
      register: _automation_rbac_results
      changed_when: false
      failed_when: false

    - name: Collect any missing permissions
      ansible.builtin.set_fact:
        _automation_rbac_missing: >-
          {{ _automation_rbac_results.results
             | rejectattr('stdout', 'search', '^yes')
             | map(attribute='item')
             | list }}
      changed_when: false

    - name: Fail with the exact permissions that are missing
      ansible.builtin.assert:
        that:
          - (_automation_rbac_missing | length) == 0
        fail_msg: >-
          The automation account
          '{{ automation_rbac_sa_namespace }}:{{ automation_rbac_sa_name }}'
          is missing {{ _automation_rbac_missing | length }} permission(s):
          {{ _automation_rbac_missing | map('to_json') | join('; ') }}.
          Re-run playbooks/bootstrap.yml as a cluster-admin to (re)apply the
          grants, or add the missing rule to automation_rbac_*_rules.
        success_msg: >-
          Automation account holds all
          {{ (_automation_rbac_ns_checks + _automation_rbac_cluster_checks + _automation_rbac_foreign_checks) | length }}
          checked permissions.
