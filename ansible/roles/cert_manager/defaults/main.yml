---
# Kubeconfig used for all cluster access from this role.
cert_manager_kubeconfig_path: "{{ armory_kubeconfig_path | default(lookup('ansible.builtin.env', 'KUBECONFIG'), true) }}"

# Namespace for cert-manager installation.
cert_manager_namespace: cert-manager

# ServiceAccount name stem used by the cert-manager TokenRequest RBAC and
# ClusterIssuer ambient Kubernetes auth configuration.
cert_manager_release_name: cert-manager

# OpenBao in-cluster API address used by cert-manager issuer integration.
# Must match openbao_cluster_addr in openbao defaults.
cert_manager_openbao_cluster_addr: "{{ openbao_cluster_addr | default('https://openbao.openbao.svc.cluster.local:8200') }}"
cert_manager_openbao_tls_server_name: "{{ openbao_tls_server_name | default('openbao.openbao.svc.cluster.local') }}"
# cert-manager bootstraps its OpenBao trust from the direct CA copy.
cert_manager_openbao_ca_secret_name: "{{ openbao_tls_ca_secret_name | default('openbao-ca') }}"

# Kubernetes auth role in OpenBao bound to cert-manager service account.
# Must align with configuration created by the openbao role.
cert_manager_openbao_k8s_role: "{{ openbao_certmanager_k8s_role | default('cert-manager') }}"

# Issuer names exposed to consumer roles.
cert_manager_openbao_internal_clusterissuer_name: openbao-pki-internal
cert_manager_openbao_external_clusterissuer_name: openbao-pki-external

# OpenBao signing path configuration for each cert-manager ClusterIssuer.
cert_manager_openbao_cluster_issuers:
  - name: "{{ cert_manager_openbao_internal_clusterissuer_name }}"
    mount: "{{ openbao_pki_internal_mount | default('pki-int') }}"
    role: "{{ openbao_pki_internal_cert_role | default('armory-internal') }}"
  - name: "{{ cert_manager_openbao_external_clusterissuer_name }}"
    mount: "{{ openbao_pki_external_mount | default('pki-ext') }}"
    role: >-
      {{ openbao_pki_external_cert_role
      | default((lookup('ansible.builtin.env', 'ARMORY_PUBLIC_DOMAIN')
      | default('armory.local', true)) | replace('.', '-dot-')) }}

# When true, disables Ansible no_log redaction for sensitive tasks.
# WARNING: Enabling this will print secrets/tokens into logs and output.
cert_manager_log_nolog: "{{ lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true) | bool }}"
