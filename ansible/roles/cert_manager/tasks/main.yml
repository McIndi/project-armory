---
- name: Resolve ARMORY_LOG_NOLOG flag
  ansible.builtin.set_fact:
    armory_log_nolog: "{{ (lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true)) | bool }}"
  changed_when: false

- name: Run cert-manager orchestration with diagnostics
  block:
    # Skipped where the cluster already provides cert-manager (OpenShift ships
    # it via openshift-cert-manager-operator). Its CRDs are cluster-scoped
    # singletons, so a second install would contend with the existing controller
    # and affect every other tenant. We reuse it and provision issuers only.
    - name: cert-manager installation
      ansible.builtin.import_tasks: install.yml
      when: certmanager_install_enabled | default(true) | bool
      tags: [cert_manager, cert_manager_install]

    # Creating a Role that grants token minting requires holding that permission,
    # so a project-scoped account cannot make this grant for itself. Where the
    # playbook runs as one, bootstrap.yml applies it instead.
    - name: cert-manager TokenRequest RBAC
      ansible.builtin.import_tasks: rbac.yml
      when: armory_privileged_tasks | default(true) | bool
      tags: [cert_manager, cert_manager_rbac]

    - name: ClusterIssuer provisioning
      ansible.builtin.import_tasks: issuer.yml
      tags: [cert_manager, cert_manager_issuer]
