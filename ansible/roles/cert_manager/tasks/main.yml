---
- name: Resolve ARMORY_LOG_NOLOG flag
  ansible.builtin.set_fact:
    cert_manager_log_nolog: "{{ (lookup('ansible.builtin.env', 'ARMORY_LOG_NOLOG') | default('false', true)) | bool }}"
  changed_when: false

- name: Run cert-manager orchestration with diagnostics
  block:
    # cert-manager v1.15+ already ships its own cert-manager-tokenrequest
    # Role/RoleBinding natively (self-service TokenRequest for ambient
    # Kubernetes auth). Armory previously created a redundant copy under the
    # same name here, which briefly deleted the live, cert-manager-owned
    # object on every bootstrap/teardown cycle before cert-manager's own
    # reconciler put it back. Confirmed via live-cluster inspection that the
    # existing Role/RoleBinding already grants exactly what's needed
    # (serviceaccounts/token create, resourceNames: [cert-manager]) — nothing
    # to create here.
    - name: ClusterIssuer provisioning
      ansible.builtin.import_tasks: issuer.yml
      tags: [cert_manager, cert_manager_issuer]
