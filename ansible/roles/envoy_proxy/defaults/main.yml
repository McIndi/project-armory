---
# In-namespace Envoy that restores the trace boundary on OpenShift.
#
# On k3s the edge is Envoy Gateway (Gateway API). That is not available here:
# OpenShift ships and actively manages the Gateway API CRDs through its Cluster
# Ingress Operator, so a second Gateway controller would contend with a core
# platform operator. And an OpenShift Route alone cannot replace it -- the router
# is HAProxy, which has no notion of W3C trace context and cannot mint one.
#
# So the edge splits in two:
#   Route  -> external exposure + TLS, using the router's wildcard certificate
#   Envoy  -> the L7 trace boundary, exactly as on k3s
#
# Envoy runs as a plain Deployment: no Gateway API CRDs, no GatewayClass, nothing
# cluster-scoped, and therefore nothing that can collide with the IBM API Connect
# gateway stack sharing this cluster.

envoy_proxy_namespace: armory-edge
envoy_proxy_name: armory-edge
envoy_proxy_kubeconfig_path: "{{ k3s_kubeconfig_path | default('/etc/rancher/k3s/k3s.yaml') }}"

envoy_proxy_image: "docker.io/envoyproxy/envoy:v1.31-latest"
envoy_proxy_replicas: 2

# Envoy's own serving port. The OpenShift router re-encrypts to this.
envoy_proxy_listen_port: 8443

# Serving certificate, issued by the OpenBao PKI internal issuer so the router
# can verify the backend leg against the same internal CA everything else uses.
envoy_proxy_tls_secret_name: armory-edge-tls
envoy_proxy_tls_certificate_name: armory-edge-tls
envoy_proxy_tls_issuer_name: "{{ certmanager_openbao_internal_clusterissuer_name | default('openbao-pki-internal') }}"
envoy_proxy_tls_issuer_kind: "{{ common_certificate_issuer_kind | default('ClusterIssuer') }}"
envoy_proxy_tls_duration: "8760h"
envoy_proxy_tls_renew_before: "720h"
envoy_proxy_tls_mount_path: /etc/envoy/tls

# CA used to verify the UPSTREAM leg (Keycloak, OpenBao). Both are issued by the
# OpenBao PKI internal CA, so one bundle covers them.
envoy_proxy_ca_secret_name: openbao-ca
envoy_proxy_ca_source_namespace: "{{ openbao_namespace | default('openbao') }}"
envoy_proxy_ca_mount_path: /etc/envoy/ca

# ── Trace boundary ────────────────────────────────────────────────────────────
# Envoy starts a FRESH trace on every inbound request rather than joining one the
# client supplied: the client's traceparent is copied to a forensic header (never
# trusted; recorded only as a span attribute) and then stripped, so the edge span
# becomes the root. Without this a caller could forge trace IDs and poison the
# audit trail.
#
# This MUST happen in an early header mutation, not in route-level header
# mutation. Route-level mutation is applied by the router filter at the END of the
# filter chain, long after the HCM has already read traceparent and started the
# span -- the headers would look right at the backend while the boundary was
# silently broken. Early header mutation runs before the tracing decision.
envoy_proxy_tracing_enabled: true
envoy_proxy_tracing_service_name: armory-edge
envoy_proxy_tracing_sampling_rate: 100
envoy_proxy_trace_forensic_header: x-external-traceparent
envoy_proxy_trace_strip_headers:
  - traceparent
  - tracestate
  - b3
  - x-b3-traceid
  - x-b3-spanid
  - x-b3-parentspanid
  - x-b3-sampled
  - x-datadog-trace-id
  - x-datadog-parent-id

# ── OTel collector ────────────────────────────────────────────────────────────
# Debug exporter only: spans (and the external.traceparent forensic attribute)
# land in the collector's pod log, which is what the readiness trace-boundary
# stage inspects. Swap the exporter when a real trace store joins the stack.
envoy_proxy_otel_enabled: "{{ envoy_proxy_tracing_enabled }}"
envoy_proxy_otel_name: otel-collector
envoy_proxy_otel_image: "docker.io/otel/opentelemetry-collector-contrib:0.111.0"
envoy_proxy_otel_grpc_port: 4317

envoy_proxy_rollout_timeout_seconds: 300

# Optional annotations for every edge Route (e.g. an IP allowlist:
# haproxy.router.openshift.io/ip_whitelist).
envoy_proxy_route_annotations: {}

# ── Upstreams ─────────────────────────────────────────────────────────────────
# Each entry becomes: an OpenShift Route (host -> this Envoy), an Envoy virtual
# host matching that hostname, and an Envoy cluster re-encrypting to the backend
# Service with its SAN verified against the internal CA.
#
# Routes must target a Service in their OWN namespace, which is why they live
# here in the edge namespace rather than with each workload. Every public
# hostname must be listed: one routed straight to its backend would bypass the
# trace boundary, leaving a hole in the audit trail that nothing would report.
#
#   - name: keycloak
#     host: keycloak.apps.example.com
#     service_fqdn: keycloak-service.keycloak.svc.cluster.local
#     port: 8443
envoy_proxy_upstreams: []

# SANs on Envoy's serving certificate: its Service FQDN (what the router dials)
# plus every public hostname it fronts.
envoy_proxy_tls_dns_names: >-
  {{ [envoy_proxy_name + '.' + envoy_proxy_namespace + '.svc.cluster.local',
      envoy_proxy_name + '.' + envoy_proxy_namespace + '.svc']
     + (envoy_proxy_upstreams | map(attribute='host') | list) }}
