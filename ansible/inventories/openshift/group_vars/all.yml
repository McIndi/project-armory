---
# OpenShift inventory overlay.
#
# Target: shared IBM Cloud Pak for Integration cluster (OCP 4.20 on vSphere).
# The cluster is MULTI-TENANT and we are cluster-admin, so the guiding rule is:
# stay inside our own namespaces and never mutate a cluster-wide singleton that
# other tenants depend on. Every override below exists to honour that rule.
#
# Deltas from inventories/development are grouped and justified. Roles are NOT
# forked for OpenShift — they are steered from here, so that role task files
# stay mergeable with `main`.

# --- Control-host / cluster access -------------------------------------------
# On k3s the Ansible controller WAS a cluster node. Here it is an external
# workstation, so all cluster access goes through a kubeconfig + `oc`.
armory_kubeconfig_path: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') | default(ansible_env.HOME + '/.kube/config', true) }}"

# Cluster CLI. k3s bundles kubectl behind `k3s kubectl`; OpenShift uses `oc`.
# Roles shell out via this var instead of hardcoding the binary.
kubectl_bin: oc

# site.yml runs as the project-scoped automation account, not as a cluster-admin,
# so the handful of tasks that need cluster-wide privilege are skipped here.
# playbooks/bootstrap.yml applies those once, as an admin — it sets this true.
#
# Kubernetes forbids granting a permission the granter does not hold, which is
# why the account genuinely cannot make those grants for itself rather than this
# being a stylistic split.
armory_privileged_tasks: false

# --- Components the cluster already provides: DO NOT INSTALL -----------------
# cert-manager is installed cluster-wide (openshift-cert-manager-operator
# v1.20.0) and its CRDs are cluster-scoped singletons. A second install would
# fight the existing controller and break other tenants. We reuse it and only
# create our own issuers/certificates.
certmanager_install_enabled: false
certmanager_namespace: cert-manager
# The issuers stay ClusterIssuers. They are consumed by Certificates in several
# namespaces; making them namespaced would mean replicating an Issuer AND its
# OpenBao vault-auth wiring into each. A ClusterIssuer is a config object that
# grants nobody anything — its only cluster-scoped risk is a NAME collision.
# tex26-* per the naming agreed with the cluster owner.
certmanager_openbao_internal_clusterissuer_name: tex26-openbao-pki-internal
certmanager_openbao_external_clusterissuer_name: tex26-openbao-pki-external

# Helm is already on the ocp-garrison workstation (installed by its Vagrantfile),
# and the controller runs as a non-root user, so armory does not dnf-install it.
# The helm-diff plugin is still installed by the role (it runs as the user).
helm_package_install_enabled: false

# --- Storage -----------------------------------------------------------------
# k3s's local-path provisioner does not exist here. The cluster default is ODF
# Ceph RBD (RWO block), which is what the databases want.
# `ocs-storagecluster-cephfs` is available if anything ever needs RWX.
armory_storage_class: ocs-storagecluster-ceph-rbd
keycloak_pg_storage_class: "{{ armory_storage_class }}"
openbao_storage_class: "{{ armory_storage_class }}"

# --- Pod security (SCC) ------------------------------------------------------
# OpenShift's default restricted-v2 SCC assigns a random UID from the namespace
# range and forbids root. The official postgres:16 image STARTS as root (its
# entrypoint chowns PGDATA, then drops to the postgres user), so it cannot run
# here — and no non-root SCC can accommodate it.
#
# Rather than grant the database permission to run as root (the `anyuid` SCC),
# use an image built to run as an arbitrary unprivileged UID. This needs NO SCC
# grant at all, so armory adds nothing cluster-scoped and stays consistent with
# its own hardening posture.
keycloak_pg_image: quay.io/sclorg/postgresql-16-c9s
keycloak_pg_manifest_template: postgres-openshift.yaml.j2

# OpenBao's "remove legacy firewall port exposure" task manages a NodePort
# firewall rule on the k3s node itself. OpenBao has no NodePort exposure on
# OpenShift (it's reached via a Route -> in-namespace Envoy), and the
# controller here is an off-cluster workstation, not the node whose firewall
# would matter anyway -- it doesn't even have python3-firewall installed.
openbao_firewall_manage: false

# OpenBao wants the IPC_LOCK capability to mlock its memory, which restricted-v2
# strips — granting it would mean a custom SCC carrying a privileged capability.
# Kubernetes nodes run with swap disabled, so locking memory against swap buys
# nothing here. Disabling mlock is the standard Vault/OpenBao-on-Kubernetes
# posture and avoids the capability entirely.
openbao_disable_mlock: true

# The OpenBao chart pins a non-root UID (100) and fsGroup (1000), which
# restricted-v2 rejects (it demands a UID from the namespace's range). nonroot-v2
# permits any NON-ROOT UID and any fsGroup — the least-privileged SCC that fits,
# and notably not `anyuid`, which would also permit root. Bound to OpenBao's
# ServiceAccount alone via a namespaced RoleBinding, so nothing cluster-scoped is
# created and no other workload is affected.
openbao_scc_name: nonroot-v2

# --- Break-glass / local state -----------------------------------------------
# The controller here is the ocp-garrison workstation, not a cluster node, so
# local state cannot be root-owned or live under /opt. Put it in the connection
# user's home, owned by that user.
openbao_work_dir: "{{ ansible_env.HOME }}/.armory/openbao"
openbao_file_owner: "{{ ansible_user_id }}"
openbao_file_group: "{{ ansible_user_id }}"

# The workstation is rebuildable (`vagrant destroy`), and the break-glass files
# are the ONLY way to unseal OpenBao — losing them strands a running OpenBao
# permanently. Mirror them into a namespace Secret so they survive, and restore
# from it on a rebuilt controller. This widens custody of the root token to
# namespace-Secret readers (see break_glass_mirror.yml); it is a deliberate
# tradeoff, and it does NOT address unseal-on-restart (that needs auto-unseal).
openbao_break_glass_k8s_secret_enabled: true

# OpenBao comes up sealed after every restart, and this cluster reschedules pods
# routinely (node drains, updates) — each one would otherwise stall Keycloak,
# certificate issuance and secret delivery until someone re-ran the playbook.
# The watcher submits the shards itself, within seconds.
#
# It spends part of the "sealed at rest" property to buy that: the shards become
# machine-readable. That is not new exposure — the break-glass Secret already
# holds the encrypted keys and their password together, so reading it was always
# enough to unseal.
openbao_unseal_watcher_enabled: true

# --- Edge --------------------------------------------------------------------
# Traffic enters via OpenShift Routes. The router serves a Let's Encrypt
# wildcard cert for *.apps.<domain>, which RHCOS nodes trust out of the box —
# that is what lets us front an in-namespace registry without any cluster-wide
# trust configuration.
armory_apps_domain: apps.example.com
armory_keycloak_host: "keycloak.{{ armory_apps_domain }}"
armory_openbao_host: "openbao.{{ armory_apps_domain }}"
armory_registry_host: "registry.{{ armory_apps_domain }}"

# Route hostnames must sit under the apps domain so the router serves them with
# its Let's Encrypt wildcard certificate — that is what makes them trusted with
# no certificate work of our own, and (for the registry) trusted by the nodes'
# container runtime for image pulls.
openbao_ingress_host: "{{ armory_openbao_host }}"

# Every public hostname terminates on Envoy, never straight on the workload.
# A hostname routed directly to its backend would bypass the trace boundary, and
# nothing would report the gap — the audit trail would just quietly be wrong.
envoy_proxy_upstreams:
  - name: keycloak
    host: "{{ armory_keycloak_host }}"
    service_fqdn: "{{ keycloak_service_name | default('keycloak-service') }}.{{ keycloak_namespace }}.svc.cluster.local"
    port: 8443
  - name: openbao
    host: "{{ armory_openbao_host }}"
    service_fqdn: "{{ openbao_tls_server_name }}"
    port: 8200
  # The readiness trace probe. expose: false — it gets a virtual host so it can be
  # tested THROUGH the boundary, but no Route, so it is never published on the
  # apps domain. Plain HTTP: it is a throwaway echo server, not a real backend.
  - name: trace-probe
    host: "{{ readiness_check_trace_probe_host }}"
    service_fqdn: "readiness-trace-probe.{{ envoy_proxy_namespace }}.svc.cluster.local"
    port: 8080
    tls: false
    expose: false

ingress_http_policy: disabled
openbao_ui_enabled: true

# --- Namespaces --------------------------------------------------------------
# The tex26-* scheme agreed with the cluster owner. Naming is ours to choose; a
# consistent prefix keeps our footprint obvious alongside the CP4I stack.
#
# Renaming the OpenBao namespace moves its in-cluster FQDN, which is baked into
# the server certificate's SANs and referenced by every consumer role. Those all
# resolve through openbao_tls_server_name, so it is set here (group_vars are
# visible to every role, unlike another role's defaults) and cascades.
keycloak_namespace: tex26-oidc
openbao_namespace: tex26-vault
envoy_proxy_namespace: tex26-gateway
registry_namespace: tex26-oci-registry

armory_namespace_labels:
  app.kubernetes.io/part-of: armory
  armory.io/owner: cbressette

# OpenBao's internal identity follows its namespace. Set all three explicitly:
# consumer roles fall back to a hardcoded openbao.openbao FQDN when these are
# undefined, which would no longer resolve.
openbao_tls_server_name: "openbao.{{ openbao_namespace }}.svc.cluster.local"
openbao_api_addr: "https://{{ openbao_tls_server_name }}:8200"
openbao_cluster_addr: "https://{{ openbao_tls_server_name }}:8200"

# The server certificate must carry the new name, or every TLS check fails.
openbao_tls_sans:
  - "DNS:openbao"
  - "DNS:openbao.{{ openbao_namespace }}"
  - "DNS:openbao.{{ openbao_namespace }}.svc"
  - "DNS:{{ openbao_tls_server_name }}"
  - "DNS:localhost"
  - "IP:127.0.0.1"

# --- Enabled components ------------------------------------------------------
keycloak_enabled: true
keycloak_pg_tls_enabled: true

# Keycloak is deployed operatorless in this branch.

# Keycloak mints its issuer and redirect URLs from this, so it must be the public
# Route URL. The Route host is derived from it; a mismatch surfaces later as
# invalid_redirect_uri / issuer-mismatch errors in every OIDC client.
keycloak_public_base_url: "https://{{ armory_keycloak_host }}"

# The operator mounts the Postgres CA truststore at a path of its own choosing.
# Operator-less, we pick the path — it stays under conf/truststores so Keycloak
# still picks the CA up automatically.
keycloak_pg_tls_ca_mount_path: /opt/keycloak/conf/truststores/postgres-ca

# --- Registry ----------------------------------------------------------------
# armory hosts its own OCI registry. Node pulls trust it for free: its Route is
# fronted by the router's Let's Encrypt wildcard certificate, which RHCOS already
# trusts, so nothing cluster-wide (image.config, node trust) is touched.
#
# It is authenticated: a Route publishes it on the cluster ingress, and an
# anonymous registry there would let anyone push an image our own workloads run.
registry_enabled: true
registry_host: "{{ armory_registry_host }}"
registry_storage_class: "{{ armory_storage_class }}"

# Namespaces whose pods pull from it. Empty for now; garrison adds its own
# agentstack namespace when it lands.
registry_pull_secret_namespaces: []

# --- Readiness ---------------------------------------------------------------
readiness_check_keycloak_enabled: true

# These two carry hardcoded defaults with no fallback through the shared vars, so
# the namespace rename has to be repeated here or the checks probe the old names.
readiness_check_keycloak_namespace: "{{ keycloak_namespace }}"
readiness_check_openbao_addr: "{{ openbao_api_addr }}"

# The trace-boundary check is the ONLY thing that empirically proves the Envoy
# early-header-mutation ordering is right. A route-level mutation would produce
# correct-looking backend headers while having silently joined the client's
# forged trace; only the "mints fresh trace" assertion catches that. Keep it on.
readiness_check_trace_boundary_enabled: true
readiness_check_tracing_enabled: "{{ envoy_proxy_tracing_enabled | default(true) }}"
readiness_check_trace_forensic_header: "{{ envoy_proxy_trace_forensic_header | default('x-external-traceparent') }}"
readiness_check_public_domain: "{{ armory_apps_domain }}"

keycloak_openbao_db_path: keycloak/db
keycloak_openbao_realm_admin_path: keycloak/realm-admin
