---
- name: Base configuration for local Fedora VM
  hosts: all
  gather_facts: true
  pre_tasks:
    # Autodetects the node IP the Envoy Gateway edge binds. Meaningless on a
    # managed cluster, where traffic enters via a Route and there is no node we
    # own — the OpenShift inventory turns this off.
    - name: Resolve canonical edge gateway IP
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_edge_gateway_ip.yml
        apply:
          tags:
            - always
            - edge_gateway_ip
      when: edge_gateway_ip_resolution_enabled | default(true) | bool
      tags:
        - always
        - edge_gateway_ip

    # Where the playbook runs as a project-scoped account, confirm up front that
    # it actually holds every permission the run needs. A missing grant would
    # otherwise surface partway through a deploy, indistinguishable from a bug in
    # whatever happened to fail first.
    - name: Verify the automation account's permissions
      ansible.builtin.include_role:
        name: automation_rbac
        tasks_from: preflight.yml
        apply:
          tags: [always, rbac_preflight]
      when: not (armory_privileged_tasks | default(true) | bool)
      tags:
        - always
        - rbac_preflight
  roles:
    - role: env_guard
      tags:
        - always
        - env_guard
        - preflight
    - role: helm
      tags:
        - helm
        - helm_install
    - role: openbao
      tags:
        - openbao
    - role: cert_manager
      tags:
        - cert_manager
        - cert_manager_install
    # Envoy Gateway is a Gateway API implementation. OpenShift 4.20 ships and
    # actively manages the Gateway API CRDs via its Cluster Ingress Operator, so
    # installing a second controller risks a tug-of-war with a core platform
    # operator. On OpenShift the edge is a Route, and the trace-boundary Envoy is
    # reintroduced as a plain in-namespace Deployment (see the envoy_proxy role).
    - role: envoy_gateway
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - envoy_gateway
    - role: keycloak
      tags:
        - keycloak
        - keycloak_install
      when: keycloak_enabled | default(false) | bool
    - role: openbao_oidc
      tags:
        - openbao_oidc
        - openbao
        - keycloak
      when: keycloak_enabled | default(false) | bool
    # The OpenShift edge. A Route alone cannot replace Envoy Gateway: the router
    # is HAProxy, which has no notion of W3C trace context and so can neither mint
    # one nor strip a forged one. Traffic therefore enters via a Route and lands
    # on an in-namespace Envoy that restores the trace boundary.
    #
    # Runs late on purpose: it needs a serving certificate from the OpenBao PKI
    # issuer (cert_manager + openbao), and its upstream Services (Keycloak,
    # OpenBao) should already exist so Envoy's clusters resolve on first boot.
    - role: envoy_proxy
      when: edge_kind | default('httproute') == 'route_envoy'
      tags:
        - envoy_proxy
        - edge
    # An OCI registry armory hosts itself. The cluster's internal registry is
    # Removed, and enabling it is a cluster-wide change; an external registry
    # would be an outside dependency. Hosting our own works because its Route is
    # fronted by the router's publicly-trusted wildcard certificate, which the
    # nodes' container runtime already trusts -- so image pulls need no
    # cluster-wide trust configuration at all.
    - role: registry
      when: registry_enabled | default(false) | bool
      tags:
        - registry
    - role: readiness_check
      tags:
        - readiness
        - readiness_check
        - post_deploy
      when: not ansible_check_mode
  post_tasks:
    # Where the controller runs outside the cluster it reaches in-cluster HTTPS
    # services through fire-and-forget `port-forward` tunnels, which would
    # otherwise outlive the play — holding ports on the controller and silently
    # serving the NEXT run against a pod that no longer exists.
    - name: Reap port-forward tunnels opened for internal HTTPS callers
      ansible.builtin.include_role:
        name: common
        tasks_from: stop_port_forwards.yml
        apply:
          tags:
            - always
            - port_forward_cleanup
      tags:
        - always
        - port_forward_cleanup
