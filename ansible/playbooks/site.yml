---
- name: Base configuration for local Fedora VM
  hosts: all
  gather_facts: true
  pre_tasks:
    # Autodetects the node IP the Envoy Gateway edge binds. Meaningless on a
    # managed cluster, where traffic enters via a Route and there is no node we
    # own — the OpenShift inventory turns this off.
    - name: Resolve canonical edge gateway IP
      ansible.builtin.include_role:
        name: common
        tasks_from: resolve_edge_gateway_ip.yml
        apply:
          tags:
            - always
            - edge_gateway_ip
      when: edge_gateway_ip_resolution_enabled | default(true) | bool
      tags:
        - always
        - edge_gateway_ip
  roles:
    - role: env_guard
      tags:
        - always
        - env_guard
        - preflight
    # The roles below own the NODE (tune the kernel, patch packages, install the
    # cluster). On OpenShift the nodes are RHCOS and managed by the platform —
    # we have no root on them and no cluster to install — so they are gated off
    # rather than deleted, keeping this file mergeable with `main`.
    - role: kernel_tuning
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - kernel_tuning
    - role: host_dependencies
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - host_dependencies
        - host_prereqs
    - role: system_update
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - system_update
        - dnf_update
    - role: helm
      tags:
        - helm
        - helm_install
    - role: k3s
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - k3s

# k3s's "restart k3s" handler (notified by config/install changes above) does not
# flush until the end of a play. Ending the play here guarantees any pending k3s
# restart happens now, before later roles deploy workloads and before
# readiness_check runs — otherwise readiness_check can pass against a control
# plane that is about to be bounced out from under every running pod.
- name: Deploy platform workloads onto a stable k3s control plane
  hosts: all
  gather_facts: false
  roles:
    - role: openbao
      tags:
        - openbao
    - role: cert_manager
      tags:
        - cert_manager
        - cert_manager_install
    - role: trust_manager
      tags:
        - trust_manager
        - trust_manager_install
      when: trust_manager_enabled | default(false) | bool
    # Envoy Gateway is a Gateway API implementation. OpenShift 4.20 ships and
    # actively manages the Gateway API CRDs via its Cluster Ingress Operator, so
    # installing a second controller risks a tug-of-war with a core platform
    # operator. On OpenShift the edge is a Route, and the trace-boundary Envoy is
    # reintroduced as a plain in-namespace Deployment (see the envoy_proxy role).
    - role: envoy_gateway
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - envoy_gateway
    - role: vso
      tags:
        - vso
        - vso_install
    - role: keycloak
      tags:
        - keycloak
        - keycloak_install
      when: keycloak_enabled | default(false) | bool
    - role: openbao_oidc
      tags:
        - openbao_oidc
        - openbao
        - keycloak
      when: keycloak_enabled | default(false) | bool
    # Headlamp existed to give cluster login via Keycloak, which required
    # reconfiguring the k3s API server's OIDC flags. On OpenShift cluster login
    # is LDAP (a shared, cluster-wide OAuth object we must not touch) and the
    # platform ships its own console, so Headlamp has no remaining role.
    - role: headlamp
      when: target_platform | default('k3s') == 'k3s'
      tags:
        - headlamp
        - headlamp_install
        - k3s_oidc
    - role: delve
      tags:
        - delve
        - delve_install
      when: delve_enabled | default(false) | bool
    - role: readiness_check
      tags:
        - readiness
        - readiness_check
        - post_deploy
      when: not ansible_check_mode
  post_tasks:
    # Where the controller runs outside the cluster it reaches in-cluster HTTPS
    # services through fire-and-forget `port-forward` tunnels, which would
    # otherwise outlive the play — holding ports on the controller and silently
    # serving the NEXT run against a pod that no longer exists.
    - name: Reap port-forward tunnels opened for internal HTTPS callers
      ansible.builtin.include_role:
        name: common
        tasks_from: stop_port_forwards.yml
        apply:
          tags:
            - always
            - port_forward_cleanup
      tags:
        - always
        - port_forward_cleanup
